name: CI — Test, Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GHCR write permission
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME will be ghcr.io/<owner>/<repo> — lowercase required by GHCR
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Setup ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Generate Prisma Client ──
      # Needed before tsc and tests — the generated types don't exist in @prisma/client yet
      - name: Generate Prisma client
        run: npx prisma generate

      # ── Type check (lint-like) ──
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── Create database tables ──
      # CI starts with a fresh PostgreSQL container — tables don't exist yet.
      # prisma db push creates all tables directly from schema.prisma.
      # (Seed data is handled by tests/helpers/db.ts → seedTestData() in beforeAll)
      - name: Push database schema
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arista_test?schema=public

      # ── Test ──
      # JWT_SECRET and API_KEYS MUST match the TEST_JWT_SECRET and TEST_API_KEYS
      # in tests/helpers/auth.ts, otherwise all JWT/auth tests fail with 401.
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arista_test?schema=public
          JWT_SECRET: test-jwt-secret-for-integration-tests-64-chars-long!!
          API_KEYS: admin:test-admin-api-key,ops:test-ops-api-key,branch:test-branch-api-key
          NODE_ENV: test
          LOG_LEVEL: error
          CACHE_TTL: 5
          APP_VERSION: 1.0.0

      # ── Build TypeScript → dist/ ──
      - name: Build application
        run: npm run build

      # ── Docker Hub login (avoids rate limits on postgres:15-alpine service) ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Docker build & push to GHCR ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
