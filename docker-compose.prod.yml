# ═══════════════════════════════════════════════════
# Production Docker Compose
# Used by Jenkins to deploy pre-built images from GHCR.
# Database is your existing PostgreSQL container — not managed here.
#
# Usage:
#   IMAGE_TAG=abc1234 docker compose -f docker-compose.prod.yml up -d
# ═══════════════════════════════════════════════════
version: "3.9"

services:
  app:
    image: ghcr.io/${GITHUB_REPO:-tamaputra23/arista-vsi}:${IMAGE_TAG:-latest}
    container_name: vehicle-stock-api
    ports:
      - "${APP_PORT:-6300}:6300"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=6300
      - NODE_ENV=production
      - API_KEYS=${API_KEYS}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CACHE_TTL=${CACHE_TTL:-300}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    restart: unless-stopped
